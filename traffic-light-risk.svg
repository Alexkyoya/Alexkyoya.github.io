    <linearGradient id="orange" x1="0" x2="1"><stop offset="0" stop-color="#ffc400"/><stop offset="1" stop-color="#f47b00"/></linearGradient>
    <linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#ef2100"/><stop offset="1" stop-color="#c90012"/></linearGradient>
  </defs>
  <rect width="600" height="360" fill="#f8fafb"/>
