<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">Traffic light credit risk gauge</title>
  <desc id="desc">A semicircular green, yellow, orange and red credit risk gauge with a central risk label.</desc>
